<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Inputs - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a></nav><main class="feature-shell"><section class="feature-hero"><h1>Input verification</h1><p>Check a seed, fertilizer, or crop-input batch against the verified registry.</p></section><section class="feature-card"><label for="code">Batch or QR code</label><input id="code" placeholder="Example: KS-TOM-2026-001"><button class="btn btn-primary" style="margin-top:12px" id="check">Verify batch</button><div id="result"></div></section></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/i18n.js"></script><script src="js/nav.js"></script><script>initFirebase();document.addEventListener('DOMContentLoaded',()=>{initNav();document.getElementById('check').onclick=async()=>{const code=document.getElementById('code').value.trim();if(!code)return;const snap=await db.collection(COLLECTIONS.verifiedInputs).doc(code).get();document.getElementById('result').className='feature-status '+(snap.exists?'':'warn');document.getElementById('result').textContent=snap.exists?`Verified: ${snap.data().product||'Registered input'} · ${snap.data().manufacturer||'Approved supplier'}`:'Not Found - do not use until the batch is independently verified.'}});</script></body></html>
