<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nearby Mandi and Cold Storage - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a></nav><main class="feature-shell"><section class="feature-hero"><h1>Nearby Mandi & Cold Storage</h1><p>Seeded facility discovery map for the demo region.</p></section><div id="facility-map" class="map-box"></div><section class="feature-card" style="margin-top:18px"><ul id="facility-list" class="feature-list"></ul></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="js/firebase-config.js"></script><script>const facilities=[{name:'Nashik APMC Mandi',type:'APMC mandi',lat:20.0059,lng:73.791},{name:'Pune Market Yard',type:'APMC mandi',lat:18.5018,lng:73.8636},{name:'Nashik Cold Chain Hub',type:'Cold storage',lat:19.997,lng:73.78}];const map=L.map('facility-map').setView([19.2,73.6],8);L.tileLayer(APP_CONFIG.mapTileUrl,{attribution:APP_CONFIG.mapAttribution}).addTo(map);facilities.forEach(f=>{L.marker([f.lat,f.lng]).addTo(map).bindPopup(`<strong>${f.name}</strong><br>${f.type}`);document.getElementById('facility-list').innerHTML+=`<li><strong>${f.name}</strong> - ${f.type}</li>`})</script></body></html>
