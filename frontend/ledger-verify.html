<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledger Verification - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a></nav><main class="feature-shell"><section class="feature-hero"><h1>Transaction ledger verification</h1><p>Lightweight hash chain demo, not a distributed blockchain.</p></section><section class="feature-card"><button class="btn btn-primary" id="verify">Verify completed orders</button><div id="result" class="feature-status" style="display:none"></div></section></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/feature-core.js"></script><script>initFirebase();document.getElementById('verify').onclick=async()=>{const result=document.getElementById('result');result.style.display='block';try{const snap=await db.collection(COLLECTIONS.orders).where('deliveryStatus','==','delivered').get();let previous='';let valid=true;for(const doc of snap.docs.sort((a,b)=>a.id.localeCompare(b.id))){const order=doc.data();const payload=KSFeatures.createLedgerPayload(order,previous);const hash=await KSFeatures.sha256(payload);const stored=await db.collection(COLLECTIONS.ledgerChain).doc(doc.id).get();if(stored.exists&&(stored.data().hash!==hash||stored.data().previousHash!==previous))valid=false;if(!stored.exists&&auth.currentUser){await db.collection(COLLECTIONS.ledgerChain).doc(doc.id).set({orderId:doc.id,hash,previousHash:previous,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}previous=hash}result.textContent=valid?`Verified ${snap.size} completed transaction(s). Chain is consistent.`:'Verification failed: a stored hash does not match the recomputed chain.';result.className=valid?'feature-status':'feature-status warn'}catch(error){result.className='feature-status warn';result.textContent=error.message}}</script></body></html>
