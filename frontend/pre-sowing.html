<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/i18n.js"></script><script src="js/nav.js"></script><script src="js/feature-core.js"></script><script>initFirebase();document.addEventListener('DOMContentLoaded',initNav);document.getElementById('run').onclick=()=>{const crops=[['Tomato',[32,35,37,40,43]],['Onion',[24,23,25,28,30]],['Soybean',[51,52,54,56,59]]];document.getElementById('results').innerHTML=crops.map(([crop,v])=>{const r=KSFeatures.forecastRange(v,30);return `<li><strong>${crop}</strong>: projected advisory range ₹${r.low}-${r.high}/unit · ${r.confidence}% confidence</li>`}).join('')}</script></body></html>
