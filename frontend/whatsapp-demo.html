<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Demo - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"><style>.wa{max-width:500px;margin:auto;background:#efeae2;border-radius:16px;overflow:hidden}.wa-head{background:#075e54;color:white;padding:18px}.bubble{max-width:82%;padding:11px 13px;margin:14px;border-radius:9px;background:white;box-shadow:0 2px 4px #0001}.bubble.me{margin-left:auto;background:#d9fdd3}</style></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a></nav><main class="feature-shell"><section class="feature-hero"><div class="feature-eyebrow">CHANNEL DEMO</div><h1>Continue on WhatsApp</h1><p>Simulated WhatsApp Business flow pending Meta Business API approval.</p></section><div class="wa"><div class="wa-head"><strong>KrishiSanjivani</strong><br><small>Business demo</small></div><div id="chat"><div class="bubble">Namaste. Reply 1 for today's rate, 2 to list produce, 3 to track an order.</div></div><div style="display:flex;padding:12px;gap:8px"><input id="reply" placeholder="Type 1, 2, or 3"><button class="btn btn-primary" id="send">Send</button></div></div></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/i18n.js"></script><script src="js/nav.js"></script><script>initFirebase();document.addEventListener('DOMContentLoaded',initNav);document.getElementById('send').onclick=()=>{const value=document.getElementById('reply').value.trim();const response={1:'Tomato today: advisory range ₹30-36/kg.',2:'Voice listing flow started. Say your crop and quantity.',3
