<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aaj ka Bhaav - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a></nav><main class="feature-shell"><section class="feature-hero"><h1>Aaj ka Bhaav</h1><p>Advisory mandi and marketplace rate range. This is separate from Bol Bhaav auctions.</p></section><div class="feature-grid"><section class="feature-card"><label>Crop</label><select id="crop"><option>tomato</option><option>onion</option><option>potato</option><option>wheat</option><option>rice</option><option>soybean</option></select><button class="btn btn-primary" style="margin-top:12px" id="check">Check today's range</button></section><section class="feature-card"><h2 id="result">Select a crop</h2><p id="engine" class="feature-muted">Forecast engine: JS trend model</p><p>This is advisory - you set the final price.</p></section></div></main><script src="js/firebase-config.js"></script><script src="js/feature-core.js"></script><script>document.getElementById('check').onclick=async()=>{const crop=document.getElementById('crop').value;const base=MOCK_PRICES[crop]?.avg||25;const r=KSFeatures.forecastRange([base*.92,base*.98,base,base*1.04,base*1.08],1);document.getElementById('result').textContent=`Suggested range: ₹${r.low}-${r.high}/kg`;document.getElementById('engine').textContent=`Forecast engine: ${r.engine} · ${r.confidence}% confidence`}</script></body></html>
