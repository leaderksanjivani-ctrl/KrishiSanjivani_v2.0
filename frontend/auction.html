<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bol Bhaav Live Auction - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a><div class="nav-spacer"></div><div class="nav-actions"><a href="profile.html" class="nav-avatar" id="nav-avatar">👤</a></div></nav><main class="feature-shell"><section class="feature-hero"><div class="feature-muted" style="color:#d1fae5">Bol Bhaav</div><h1>Live auction</h1><p>Firestore real-time bidding with a browser-only demo settlement flow.</p></section><div class="feature-grid"><section class="feature-card"><h2 id="auction-title">Loading auction...</h2><p id="auction-meta" class="feature-muted"></p><h3 id="auction-price">₹0</h3><p id="auction-countdown" class="feature-status warn">Waiting for auction</p><label for="bid-amount">Your bid</label><input id="bid-amount" type="number" min="1" step="1"><button class="btn btn-primary" style="margin-top:12px" id="bid-button">Place bid</button><div id="auction-message"></div></section><section class="feature-card"><h2>Live bids</h2><div id="bid-list"><p class="feature-muted">No bids yet.</p></div></section></div></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/feature-core.js"></script><script src="js/i18n.js"></script><script src="js/nav.js"></script><script>initFirebase();let auctionId=new URLSearchParams(location.search).get('id'),auctionRef,unsub;function setMessage(text,warn=false){const n=document.getElementById('auction-message');n.className=warn?'feature-status warn':'feature-status';n.textContent=text}async function start(){initNav();requireAuth(async user=>{auctionId=auctionId||'demo-auction';auctionRef=db.collection(COLLECTIONS.auctions).doc(auctionId);unsub=auctionRef.onSnapshot(async snap=>{if(!snap.exists){document.getElementById('auction-title').textContent='Auction not found';return}const a=snap.data();document.getElementById('auction-title').textContent=a.title||a.crop||'Produce auction';document.getElementById('auction-meta').textContent=`${a.locationText||'India'} · ${a.auctionStatus||'live'}`;document.getElementById('auction-price').textContent=`₹${Number(a.currentBid||a.startingPrice||0).toLocaleString('en-IN')}`;document.getElementById('bid-amount').min=Number(a.currentBid||a.startingPrice||0)+Number(a.minIncrement||1);renderBids(a);tick(a);if(a.auctionEndAt&&Date.now()>=new Date(a.auctionEndAt).getTime()&&a.auctionStatus==='live')await settleAuction(a,user.uid)});document.getElementById('bid-button').onclick=()=>placeBid(user)});document.getElementById('bid-amount').focus()}function renderBids(a){const bids=a.bids||[];document.getElementById('bid-list').innerHTML=bids.length?bids.slice().sort((x,y)=>y.amount-x.amount).map(b=>`<div class="auction-bid"><span>${b.bidderName||'Buyer'}</span><strong>₹${b.amount}</strong></div>`).join(''):'<p class="feature-muted">No bids yet.</p>'}function tick(a){const end=new Date(a.auctionEndAt||Date.now()).getTime();const left=Math.max(0,end-Date.now());document.getElementById('auction-countdown').textContent=left?`Ends in ${Math.ceil(left/60000)} minutes`:'Auction ended'}async function placeBid(user){const amount=Number(document.getElementById('bid-amount').value);const snap=await auctionRef.get();const a=snap.data();if(!amount||amount<=Number(a.currentBid||a.startingPrice||0)){setMessage('Bid must exceed the current highest bid.',true);return}const bid={amount,bidderId:user.uid,bidderName:user.displayName||user.email||'Buyer',createdAt:new Date().toISOString()};await auctionRef.update({currentBid:amount,currentBidderId:user.uid,bids:firebase.firestore.FieldValue.arrayUnion(bid)});setMessage('Bid placed. The list updates live.')}async function settleAuction(a,uid){if(a.auctionStatus!=='live'||a.settledBy)return;await auctionRef.update({auctionStatus:'ended',winnerId:a.currentBidderId||null,settledBy:uid,settledAt:firebase.firestore.FieldValue.serverTimestamp()});setMessage(a.currentBidderId?`Winner recorded: ${a.currentBidderId}`:'Auction ended without bids.')}document.addEventListener('DOMContentLoaded',start);</script></body></html>
