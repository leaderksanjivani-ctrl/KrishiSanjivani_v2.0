<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Buy - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a><div class="nav-spacer"></div><div class="nav-actions"><a href="profile.html" class="nav-avatar" id="nav-avatar">👤</a></div></nav><main class="feature-shell"><section class="feature-hero"><h1>Neighbourhood Group Buy</h1><p>Share a code, combine demand, and unlock bulk pricing.</p></section><div class="feature-grid"><section class="feature-card"><h2>Create a pool</h2><label>Produce</label><input id="crop" value="Tomato"><label>Household target</label><input id="target" type="number" value="10" min="2"><label>Discounted rate (₹/kg)</label><input id="price" type="number" value="24"><button class="btn btn-primary" style="margin-top:12px" id="create">Create group buy</button><div id="create-message"></div></section><section class="feature-card"><h2>Join a pool</h2><label>Join code</label><input id="join-id" placeholder="Paste group ID"><button class="btn btn-outline" style="margin-top:12px" id="join">Join group</button><div id="join-message"></div></section></div><section class="feature-card" style="margin-top:18px"><h2 id="pool-title">Live progress</h2><div class="progress-track"><div class="progress-fill" id="progress" style="width:0%"></div></div><p id="progress-text" class="feature-status">Create or join a pool to see progress.</p></section></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/feature-core.js"></script><script src="js/i18n.js"></script><script src="js/nav.js"></script><script>initFirebase();let poolId=new URLSearchParams(location.search).get('id');function draw(p){const joined=Number(p.joinedHouseholds||0),target=Number(p.targetHouseholds||10);document.getElementById('pool-title').textContent=`${p.crop||'Produce'} group buy`;document.getElementById('progress').style.width=`${Math.min(100,joined/target*100)}%`;document.getElementById('progress-text').textContent=`${joined} of ${target} households joined - ${Math.max(0,target-joined)} more to unlock ₹${p.discountedPrice||p.price}/kg`;location.hash=p.id||poolId||''}async function watch(id){poolId=id;db.collection(COLLECTIONS.groupBuys).doc(id).onSnapshot(s=>s.exists&&draw({id:s.id,...s.data()}))}document.addEventListener('DOMContentLoaded',()=>{initNav();requireAuth(user=>{if(poolId)watch(poolId);document.getElementById('create').onclick=async()=>{const ref=await db.collection(COLLECTIONS.groupBuys).add({crop:document.getElementById('crop').value,targetHouseholds:Number(document.getElementById('target').value),discountedPrice:Number(document.getElementById('price').value),joinedHouseholds:1,createdBy:user.uid,participantIds:{[user.uid]:true},status:'open',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('create-message').textContent=`Share this join code: ${ref.id}`;watch(ref.id)};document.getElementById('join').onclick=async()=>{const id=document.getElementById('join-id').value.trim();if(!id)return;const ref=db.collection(COLLECTIONS.groupBuys).doc(id);await ref.update({joinedHouseholds:firebase.firestore.FieldValue.increment(1),[`participantIds.${user.uid}`]:true});document.getElementById('join-message').textContent='Joined successfully';watch(id)}})});</script></body></html>
