<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call to Register - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a></nav><main class="feature-shell"><section class="feature-hero"><div class="feature-eyebrow">VOICE DEMO</div><h1>Call to Register</h1><p>Web simulation of the intended IVR and voice-to-listing pipeline.</p></section><section class="feature-card"><p class="feature-status">Say: “I have 50 kg tomato in Nashik”</p><button class="btn btn-primary" id="listen">Start simulated call</button><textarea id="transcript" rows="3" placeholder="Speech transcript appears here"></textarea><div class="feature-grid"><div><label>Crop</label><input id="crop"></div><div><label>Quantity</label><input id="qty" type="number"></div><div><label>Location</label><input id="location"></div></div><button class="btn btn-outline feature-action" id="publish">Confirm demo listing</button><div id="message"></div><p class="feature-muted">Simulation only: browser Web Speech API, not a live toll-free carrier.</p></section></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/i18n.js"></script><script src="js/nav.js"></script><script src="js/voice.js"></script><script>initFirebase();document.addEventListener('DOMContentLoaded',initNav);const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;document.getElementById('listen').onclick=()=>{if(!Speech){document.getElementById('message').textContent='Speech recognition is unavailable; type a transcript instead.';return}const r=new Speech();r.lang=LANG_SPEECH_CODES[currentLang]||'en-IN';r.onresult=async e=>{const raw=e.results[0][0].transcript;const text=await normalizeVoiceText(raw);document.getElementById('transcript').value=text;const m=text.match(/(\d+)\s*kg\s*([a-z]+)/i);document.getElementById('qty').value=m?.[1]||50;document.getElementById('crop').value=m?.[2]||'tomato';document.getElementById('location').value=/in\s+([a-z ]+)/i.exec(text)?.[1]||'Nashik'};r.start()};document.getElementById('publish').onclick=()=>{document.getElementById('message').className='feature-status';document.getElementById('message').textContent='SMS simulation: Your voice listing draft is ready. Reply STOP to remove.'}</script></body></html>
