<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Sakhi - KrishiSanjivani</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/features.css"></head><body><nav id="main-nav"><a href="dashboard.html" class="nav-logo"><div class="nav-logo-icon">🌾</div><span class="nav-logo-text">KrishiSanjivani</span></a></nav><main class="feature-shell"><section class="feature-hero"><h1>My Sakhi</h1><p>Ask an agronomist for practical advice. This ticket is separate from KrishiBot.</p></section><section class="feature-card"><label>Advice topic</label><select id="topic"><option>Pest control</option><option>Crop selection</option><option>Pricing</option><option>Post-harvest handling</option></select><label>Your question</label><textarea id="question" rows="5" placeholder="Describe your crop, location, and question"></textarea><button class="btn btn-primary" style="margin-top:12px" id="send">Send to expert</button><div id="message"></div></section><section class="feature-card" style="margin-top:18px"><h2>My requests</h2><div id="tickets" class="feature-list">Loading...</div></section></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/i18n.js"></script><script src="js/nav.js"></script><script>initFirebase();document.addEventListener('DOMContentLoaded',()=>{initNav();requireAuth(user=>{const q=db.collection(COLLECTIONS.expertQueries).where('farmerId','==',user.uid);q.onSnapshot(s=>{document.getElementById('tickets').innerHTML=s.empty?'No requests yet.':s.docs.map(d=>{const x=d.data();return `<li><strong>${x.topic}</strong> - ${x.status||'Pending'}<br><span class="feature-muted">${x.response||x.question}</span></li>`}).join('')});document.getElementById('send').onclick=async()=>{const question=document.getElementById('question').value.trim();if(!question)return;await db.collection(COLLECTIONS.expertQueries).add({farmerId:user.uid,topic:document.getElementById('topic').value,question,status:'Pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('message').className='feature-status';document.getElementById('message').textContent='Request sent. An expert will respond asynchronously.';document.getElementById('question').value=''}})});</script></body></html>
