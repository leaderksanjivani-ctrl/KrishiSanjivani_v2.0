<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Rental — KrishiSanjivani</title>
  <meta name="description" content="Rent tractors, tillers, harvesters, and spraying drones by the day directly from nearby farmers.">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/marketplace.css">
  <style>
    .rental-hero {
      background: linear-gradient(135deg, #1E1B4B, #312E81);
      color: #fff; padding: var(--sp-2xl) 0; border-radius: var(--r-2xl); margin-top: var(--sp-md); margin-bottom: var(--sp-xl);
    }
    .rental-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-lg); margin-bottom: var(--sp-3xl);
    }
    .equipment-card {
      background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-xl); overflow: hidden;
      display: flex; flex-direction: column; transition: all var(--tr-base);
    }
    .equipment-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: #7C3AED; }
    .equipment-img-box {
      height: 180px; background: linear-gradient(135deg, #EDE9FE, #DDD6FE);
      display: flex; align-items: center; justify-content: center; font-size: 5rem; position: relative;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
      z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #fff; width: 90%; max-width: 480px; border-radius: var(--r-2xl); padding: var(--sp-xl); color: #000;
    }
    @media (max-width: 900px) { .rental-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .rental-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav id="main-nav">
  <a href="dashboard.html" class="nav-logo">
    <div class="nav-logo-icon">🌾</div>
    <span class="nav-logo-text" data-i18n="app_name">KrishiSanjivani</span>
  </a>
  <div class="nav-spacer"></div>
  <div class="nav-actions">
    <button class="nav-low-data" id="low-data-btn" data-i18n="low_data_mode">Low Data</button>
    <select id="lang-select" title="Language">
      <option value="en">🌐 EN</option>
      <option value="hi">हिं</option>
      <option value="mr">मरा</option>
    </select>
    <a href="profile.html" class="nav-avatar" id="nav-avatar">👤</a>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container">
    
    <!-- HERO BANNER -->
    <div class="rental-hero">
      <div class="container text-center" style="max-width:680px">
        <span class="badge badge-gold mb-xs" style="background:#F59E0B;color:#000">🚜 Peer-to-Peer Rental</span>
        <h1 style="font-size:var(--fs-3xl);font-weight:800;margin-bottom:8px">Rent Farm Machinery by the Day</h1>
        <p style="opacity:0.85;font-size:var(--fs-sm)">No need to buy expensive equipment. Rent tractors, harvesters, and drones from nearby farmers at affordable daily rates.</p>
      </div>
    </div>

    <!-- CATEGORY FILTER CHIPS -->
    <div class="filter-chips mb-lg" id="cat-chips">
      <button class="filter-chip active" data-cat="all">⚙️ All Machinery</button>
      <button class="filter-chip" data-cat="tractor">🚜 Tractors</button>
      <button class="filter-chip" data-cat="tiller">⚙️ Tillers / Rotavators</button>
      <button class="filter-chip" data-cat="drone">🚁 Spraying Drones</button>
      <button class="filter-chip" data-cat="harvester">🌾 Harvesters</button>
      <button class="filter-chip" data-cat="pump">💦 Water Pumps</button>
    </div>

    <!-- EQUIPMENT GRID -->
    <div class="rental-grid" id="rental-grid">
      <!-- Populated by JS -->
    </div>

  </div>
</div>

<!-- BOOKING MODAL -->
<div class="modal-overlay" id="booking-modal">
  <div class="modal-box">
    <div class="flex-between align-center mb-md">
      <h3 style="font-size:var(--fs-xl);font-weight:800" id="modal-eq-title">Book Equipment</h3>
      <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="flex gap-md">
        <div style="flex:1">
          <label style="font-size:12px;font-weight:700">Start Date</label>
          <input type="date" id="book-start" class="input" value="2026-09-13">
        </div>
        <div style="flex:1">
          <label style="font-size:12px;font-weight:700">Days</label>
          <input type="number" id="book-days" class="input" value="2" min="1" max="30">
        </div>
      </div>

      <div style="background:var(--c-bg);padding:12px;border-radius:var(--r-lg);font-size:13px">
        <div class="flex-between">
          <span>Daily Rate:</span>
          <strong id="modal-daily-rate">₹800/day</strong>
        </div>
        <div class="flex-between style='margin-top:4px'">
          <span>Estimated Total:</span>
          <strong style="color:var(--c-green);font-size:16px" id="modal-total-rate">₹1,600</strong>
        </div>
      </div>

      <button class="btn btn-primary btn-lg w-100 mt-md" id="confirm-booking-btn">
        ✅ Confirm Booking
      </button>
    </div>
  </div>
</div>

<!-- AI CHATBOT -->
<button id="chatbot-btn" title="Chat with KrishiBot">
  🤖<div class="chatbot-badge" style="display:none">1</div>
</button>
<div id="chatbot-panel" class="hidden">
  <div class="chatbot-header">
    <div class="chatbot-avatar">🌾</div>
    <div class="chatbot-info">
      <strong data-i18n="chatbot_title">KrishiBot</strong>
      <span>AI Assistant • Always Online</span>
    </div>
    <button class="chatbot-close" id="chatbot-close">✕</button>
  </div>
  <div class="chatbot-messages" id="chatbot-messages"></div>
  <div class="chatbot-suggestions" id="chatbot-suggestions"></div>
  <div class="chatbot-input-row">
    <input type="text" class="chatbot-input" id="chatbot-input" placeholder="Ask me anything...">
    <button class="chatbot-send" id="chatbot-send">➤</button>
  </div>
</div>

<div id="toast-container"></div>

<!-- SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/chatbot.js"></script>

<script>
  initFirebase();

  let selectedEquipment = null;

  const MOCK_EQUIPMENT = [
    { id: 'eq1', name: 'Mahindra 575 DI Tractor (45 HP)', cat: 'tractor', icon: '🚜', owner: 'Mahadev Kadam', location: 'Nashik (6km)', rate: 800, rating: 4.9 },
    { id: 'eq2', name: 'KrishiRotavator 6 Feet', cat: 'tiller', icon: '⚙️', owner: 'Suresh Patil', location: 'Nashik (10km)', rate: 400, rating: 4.8 },
    { id: 'eq3', name: 'AgriFly 10L Pesticide Drone', cat: 'drone', icon: '🚁', owner: 'TechAgri Services FPO', location: 'Satara (15km)', rate: 1200, rating: 5.0 },
    { id: 'eq4', name: 'Paddy Multi-Crop Harvester', cat: 'harvester', icon: '🌾', owner: 'Konkan Co-op', location: 'Raigad (25km)', rate: 1800, rating: 4.7 },
    { id: 'eq5', name: '5 HP Kirloskar Diesel Water Pump', cat: 'pump', icon: '💦', owner: 'Ramesh Thorne', location: 'Baramati (8km)', rate: 250, rating: 4.6 },
    { id: 'eq6', name: 'Sonalika 750 Heavy Duty Tractor', cat: 'tractor', icon: '🚜', owner: 'Vikas Shinde', location: 'Pune (14km)', rate: 950, rating: 4.8 }
  ];

  document.addEventListener('DOMContentLoaded', async () => {
    await initI18n();
    initNav();
    initChatbot();

    renderEquipment('all');

    document.getElementById('cat-chips').addEventListener('click', (e) => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderEquipment(chip.dataset.cat);
    });

    document.getElementById('book-days').addEventListener('input', updateModalTotal);
    document.getElementById('confirm-booking-btn').addEventListener('click', confirmBooking);
  });

  function renderEquipment(cat) {
    const grid = document.getElementById('rental-grid');
    const filtered = cat === 'all' ? MOCK_EQUIPMENT : MOCK_EQUIPMENT.filter(e => e.cat === cat);

    grid.innerHTML = filtered.map(item => `
      <div class="equipment-card">
        <div class="equipment-img-box">
          ${item.icon}
          <span class="badge badge-green" style="position:absolute;top:12px;left:12px">Available</span>
        </div>
        <div class="card-body flex-1 flex-column gap-xs" style="padding:16px">
          <strong style="font-size:var(--fs-base)">${item.name}</strong>
          <div style="font-size:12px;color:var(--c-text-muted)">
            <span>👨‍🌾 ${item.owner}</span> · <span>📍 ${item.location}</span>
          </div>
          <div style="font-size:12px;color:var(--c-gold)">⭐ ${item.rating} Rating</div>

          <div class="flex-between align-center mt-sm" style="border-top:1px solid var(--c-border);padding-top:10px">
            <div>
              <strong style="font-size:var(--fs-xl);color:var(--c-purple)">₹${item.rate}</strong>
              <span style="font-size:11px;color:var(--c-text-muted)">/ day</span>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openBookingModal('${item.id}')">
              📅 Book Now
            </button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function openBookingModal(eqId) {
    selectedEquipment = MOCK_EQUIPMENT.find(e => e.id === eqId);
    if (!selectedEquipment) return;

    document.getElementById('modal-eq-title').textContent = `Book ${selectedEquipment.name}`;
    document.getElementById('modal-daily-rate').textContent = `₹${selectedEquipment.rate}/day`;
    updateModalTotal();
    document.getElementById('booking-modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('booking-modal').classList.remove('active');
  }

  function updateModalTotal() {
    if (!selectedEquipment) return;
    const days = parseInt(document.getElementById('book-days').value) || 1;
    const total = days * selectedEquipment.rate;
    document.getElementById('modal-total-rate').textContent = `₹${total.toLocaleString('en-IN')}`;
  }

  function confirmBooking() {
    closeModal();
    showToast(`✅ Booking request sent to ${selectedEquipment.owner}!`, 'success');
  }
</script>
</body>
</html>
